<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- PLACEHOLDER banner 4: the shop. Replace with a real photo of your storefront (1600×900 or wider). -->
  <defs>
    <radialGradient id="g" cx="72%" cy="50%" r="55%">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#111111"/>
    </radialGradient>
    <clipPath id="awn"><rect x="860" y="250" width="560" height="90" rx="12"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <!-- building -->
  <rect x="880" y="200" width="520" height="560" rx="16" fill="#1F1F1F" stroke="#525252" stroke-width="6"/>
  <!-- sign board -->
  <rect x="940" y="150" width="400" height="80" rx="12" fill="#FFFFFF"/>
  <path d="M990 210l26-44 26 44z" fill="#E84426"/>
  <rect x="1060" y="176" width="200" height="16" rx="8" fill="#111111"/>
  <rect x="1060" y="200" width="140" height="10" rx="5" fill="#737373"/>
  <rect x="1290" y="168" width="14" height="14" fill="#E84426"/>
  <!-- awning -->
  <g clip-path="url(#awn)">
    <rect x="860" y="250" width="560" height="90" fill="#F5F5F5"/>
    <g fill="#E84426">
      <rect x="860" y="250" width="70" height="90"/><rect x="1000" y="250" width="70" height="90"/>
      <rect x="1140" y="250" width="70" height="90"/><rect x="1280" y="250" width="70" height="90"/>
    </g>
  </g>
  <!-- window with products -->
  <rect x="920" y="380" width="250" height="300" rx="12" fill="#262626"/>
  <g fill="#E84426"><rect x="950" y="420" width="50" height="96" rx="12"/></g>
  <g fill="#F4F4F4"><rect x="1020" y="420" width="50" height="96" rx="12"/><rect x="950" y="560" width="80" height="60" rx="12"/></g>
  <g fill="#737373"><rect x="1090" y="420" width="50" height="96" rx="12"/><rect x="1060" y="560" width="80" height="60" rx="30"/></g>
  <!-- door -->
  <rect x="1210" y="380" width="150" height="380" rx="12" fill="#262626" stroke="#525252" stroke-width="6"/>
  <circle cx="1336" cy="580" r="9" fill="#E84426"/>
  <g>
    <rect x="1440" y="96" width="22" height="22" fill="#E84426"/>
    <rect x="1476" y="76" width="14" height="14" fill="#E84426"/>
    <rect x="1412" y="128" width="16" height="16" fill="#F5F5F5"/>
  </g>
